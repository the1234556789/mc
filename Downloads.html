<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>无法访问此页面</title>
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Segoe UI,system-ui,-apple-system,sans-serif;
}
body{
    background:#f8f8f8;
    padding-top:120px;
}
.wrapper{
    width:360px;
    margin:0 auto;
}
.cloud{
    width:84px;
    margin-bottom:24px;
}
h1{
    font-size:24px;
    font-weight:500;
    color:#111;
    margin-bottom:12px;
}
.domain-text{
    font-size:15px;
    margin-bottom:14px;
    color:#222;
}
.tip-head{
    font-size:15px;
    font-weight:600;
    margin-bottom:8px;
}
ul{
    padding-left:18px;
    margin-bottom:16px;
}
li{
    font-size:15px;
    margin:6px 0;
}
a{
    color:#0067c0;
    text-decoration:underline;
}
.err-code{
    font-size:14px;
    color:#666;
    margin-bottom:28px;
}
#refresh{
    background:#0078d4;
    color:#fff;
    border:none;
    padding:8px 28px;
    font-size:15px;
    cursor:pointer;
}
.detail{
    margin-top:32px;
    font-size:15px;
    cursor:pointer;
}
</style>
</head>
<body>
<div class="wrapper">
<img class="cloud" src="cloud.png">
<h1>嗯…无法访问此页面</h1>
<div class="domain-text">the1234556789.github.io/mc 已拒绝连接。</div>
<div class="tip-head">请尝试：</div>
<ul>
    <li>检查连接</li>
    <li><a>检查代理和防火墙</a></li>
</ul>
<div class="err-code">ERR_CONNECTION_REFUSED</div>
<button id="refresh">刷新</button>
<div class="detail">⌄ 详细信息</div>
</div>
<script>
document.querySelector("#refresh").onclick=()=>{}
</script>
</body>
</html>
